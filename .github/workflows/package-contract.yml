name: Package contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    name: Verify published package contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package contract
        run: pnpm test:package
