name: Lexical compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/lexical-compatibility.yml"
      - ".pnpmfile.mjs"
      - "scripts/compatibility/**"
      - ".prettierignore"
      - ".prettierrc"
      - "eslint.config.js"
      - "package.json"
      - "packages/demo/package.json"
      - "packages/demo/e2e/**"
      - "packages/lexical-review/**"
      - "playwright.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Lexical version for a focused investigation"
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      unitMatrix: ${{ steps.resolve.outputs.unitMatrix }}
      e2eMatrix: ${{ steps.resolve.outputs.e2eMatrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve matrix
        id: resolve
        env:
          LEXICAL_COMPATIBILITY_MATRIX_VERSION: ${{ inputs.version }}
        run: node scripts/compatibility/runner.mjs matrix --github-output >> "$GITHUB_OUTPUT"

  compatibility:
    name: Lexical ${{ matrix.version }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.unitMatrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Run compatibility checks
        run: pnpm compatibility -- --version "${{ matrix.version }}"

  e2e:
    name: E2E Lexical ${{ matrix.lexicalVersion }} React ${{ matrix.reactVersion }} (${{ matrix.project }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.e2eMatrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Run browser compatibility checks
        env:
          PLAYWRIGHT_INSTALL_BROWSERS: "true"
        run: >-
          pnpm compatibility:e2e --
          --version "${{ matrix.lexicalVersion }}"
          --react-version "${{ matrix.reactVersion }}"
          --project "${{ matrix.project }}"

      - name: Upload Playwright diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.lexicalVersion }}-${{ matrix.reactVersion }}-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
