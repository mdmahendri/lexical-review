name: Lexical compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/lexical-compatibility.yml"
      - ".pnpmfile.mjs"
      - "scripts/compatibility/**"
      - ".prettierignore"
      - ".prettierrc"
      - "eslint.config.js"
      - "package.json"
      - "packages/demo/package.json"
      - "packages/lexical-review/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Lexical version for a focused investigation"
        required: false
        type: string

permissions:
  contents: read

jobs:
  matrix:
    name: Resolve compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      e2e: ${{ steps.matrix.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve matrix
        id: matrix
        env:
          LEXICAL_COMPATIBILITY_MATRIX_VERSION: ${{ inputs.version }}
        run: node scripts/compatibility/runner.mjs matrix --github-output >> "$GITHUB_OUTPUT"

  compatibility:
    name: Lexical ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Run compatibility checks
        run: pnpm compatibility -- --version "${{ matrix.version }}"
