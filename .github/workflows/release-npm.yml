name: Release package to NPM registry

on:
  release:
    types: ["published"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies Frozen
        run: pnpm --filter lexical-review install --frozen-lockfile

      - name: Build Lexical-Review
        run: pnpm --filter lexical-review build

      - name: Publish to NPM registry
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: pnpm publish packages/lexical-review --access public --no-git-checks --provenance
